<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="form-container">
        <h2>Registro</h2>
        <form id="registrationForm">
            <label for="username">Nome de Usuário:</label>
            <input type="text" id="nome" name="username" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">Senha:</label>
            <input type="password" id="senha" name="password" required>
            
            <button type="button" id="cadastro">Registrar</button>
        </form>

        <h2>Login</h2>
        <form id="loginForm">
            <label for="emaillogin">Email:</label>
            <input type="email" id="emaillogin" name="emaillogin" required>
            
            <label for="senhalogin">Senha:</label>
            <input type="password" id="senhalogin" name="senhalogin" required>
            
            <button type="button" id="login">Login</button>
        </form>
    </div>
</body>
</html>
